name: Build-Amjad-System
on: [push]
jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install dependencies
        run: npm install
      - name: Build Electron App
        run: |
          mkdir -p dist
          npm run build
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Agence-Amjad-System-EXE
          path: dist/*.exe
